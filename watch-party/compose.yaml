name: stremio-watch-party

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: stremio-watch-party-jellyfin
    init: true
    ports:
      - "3210:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - jellyfin-media:/media
    cpus: 2.0
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8096/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  bridge:
    build: .
    container_name: stremio-watch-party-bridge
    init: true
    depends_on:
      jellyfin:
        condition: service_healthy
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_USERNAME: ${JELLYFIN_USERNAME:-watchparty}
      JELLYFIN_PASSWORD: ${JELLYFIN_PASSWORD:-watchparty}
    ports:
      - "3211:3211"
    volumes:
      - jellyfin-media:/media
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellyfin-media:
