name: stremio-watch-web

services:
  watch-web:
    build: .
    container_name: stremio-watch-web
    init: true
    ports:
      - "3211:3211"   # the TV bridge already targets this port; browsers use it too
    environment:
      # ISOLATE=1 adds COOP/COEP so jassub can use multithreaded libass. CDN fetches
      # are CORS requests, so they keep working under COEP.
      ISOLATE: ${ISOLATE:-0}
      # Shared password for the site (set in .env). Empty = no login.
      WATCH_PASSWORD: ${WATCH_PASSWORD:-}
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Permanent public hostname via a named Cloudflare Tunnel (replaces `cloudflared tunnel --url`).
  # Enabled by COMPOSE_PROFILES=tunnel and CF_TUNNEL_TOKEN in .env; see README "Public hostname".
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: stremio-watch-web-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN in .env}
    depends_on:
      watch-web:
        condition: service_healthy
    restart: unless-stopped
