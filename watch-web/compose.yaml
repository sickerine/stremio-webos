name: stremio-watch-web

services:
  watch-web:
    build: .
    container_name: stremio-watch-web
    init: true
    volumes:
      - ./comparison-media:/app/comparison-media:ro
    ports:
      - "3211:3211"   # the TV bridge already targets this port; browsers use it too
    environment:
      # ISOLATE=1 adds COOP/COEP so jassub can use multithreaded libass. CDN fetches
      # are CORS requests, so they keep working under COEP.
      ISOLATE: ${ISOLATE:-0}
      # Shared password for the site (set in .env). Empty = no login.
      WATCH_PASSWORD: ${WATCH_PASSWORD:-}
      # Key the TV must send as ?key= in its relay URL (set in .env). Empty = any client may act as the TV.
      TV_KEY: ${TV_KEY:-}
      # webOS inspector of the TV app (dev mode) for GET /tv/screenshot.
      TV_INSPECTOR: ${TV_INSPECTOR:-192.168.1.37:9998}
    cpus: 2        # a 4K HEVC frame grab takes ~13s at 2 cpus
    mem_limit: 1g  # 4K HEVC decode + tone-map for /tv/screenshot
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Permanent public hostname via a named Cloudflare Tunnel (replaces `cloudflared tunnel --url`).
  # Enabled by COMPOSE_PROFILES=tunnel in .env; see README "Public hostname".
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: stremio-watch-web-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro   # config.yml + credentials.json from `cloudflared tunnel create` (git-ignored)
    depends_on:
      watch-web:
        condition: service_healthy
    restart: unless-stopped
